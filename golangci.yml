version: "2"

run:
  timeout: 5m
  tests: true
  issues-exit-code: 1

output:
  print-issued-lines: true
  sort-results: true

linters:
  # v2 用 default 控制“基础启用集”；等价于 v1 的 disable-all: true
  default: none

  enable:
    # --- E 可维护性 / 结构 / 重复 / 复杂度（最高优先级） ---
    - govet
    - staticcheck
    - gocritic
    - revive
    - ineffassign
    - unused
    - unconvert
    - prealloc
    - nilerr
    - errname
    - dupl
    - gocyclo
    - cyclop
    - funlen
    - lll
    - misspell
    - nakedret

    # --- 错误处理一致性（wrap / 日志 / 重试 / 幂等） ---
    - errcheck
    - errorlint
    - wrapcheck

    # --- 安全（输入校验 / 注入 / 常见漏洞） ---
    - gosec
    - bodyclose

    # --- 并发 / 竞态 / 泄露 ---
    - unparam
    - forbidigo
    - copyloopvar

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - whyNoLint

    revive:
      rules:
        - name: var-naming
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: blank-imports
        - name: unnecessary-stmt
        - name: superfluous-else
        - name: early-return
        - name: indent-error-flow

    dupl:
      threshold: 120

    gocyclo:
      min-complexity: 12

    cyclop:
      max-complexity: 12

    funlen:
      lines: 120
      statements: 60

    lll:
      line-length: 140

    misspell:
      locale: US

    errcheck:
      check-type-assertions: true
      check-blank: true

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    wrapcheck:
      ignoreSigs:
        - "fmt.Errorf("
        - "errors.New("
      ignorePackageGlobs:
        - "testing"
        - "net/http"
        - "database/sql"

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104
        - G307

  exclusions:
    # 如果你想保持 v1 的“宽松识别 generated 文件”，这里用 lax（v2 默认更严格） :contentReference[oaicite:1]{index=1}
    generated: lax
    warn-unused: true

    # v2：exclude-rules 移到这里
    rules:
      - path: '_test\.go'
        linters:
          - dupl
          - funlen
          - gocyclo
          - cyclop
          - gosec
          - errcheck
      - path: '(^|.*/)internal/arch(/|$)'
        linters:
          - dupl

    # v2：用 paths 排除目录（只是不报告 issue，仍会分析；想“跳过分析”得用 run 的 skip 配置/或拆分 invocation）
    paths:
      - '^(vendor|third_party|gen|generated)/'
      - '(^|.*/)internal/arch(/|$)'
      

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

